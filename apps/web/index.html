<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="QSimCity — an explorable 3D quantum city driven by real computation traces. An unofficial, independent educational and research visualization project."
    />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#0a0d16" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="canonical" href="https://qsimcity.vercel.app/" />
    <title>QSimCity — the explorable quantum city</title>

    <!--
      Social metadata. The card image is the application's own icon, served
      from this origin: no third-party asset, no external request, and nothing
      that could carry tracking. `og:image` needs an absolute URL, which is
      why the canonical origin appears here.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="QSimCity" />
    <meta property="og:title" content="QSimCity — the explorable quantum city" />
    <meta
      property="og:description"
      content="Watch a quantum program travel through a living city: parsed, laid out, routed, translated, optimized, scheduled, executed, and measured. Every light is driven by a real computation trace."
    />
    <meta property="og:url" content="https://qsimcity.vercel.app/" />
    <meta property="og:image" content="https://qsimcity.vercel.app/icons/icon-512.png" />
    <meta property="og:image:width" content="512" />
    <meta property="og:image:height" content="512" />
    <meta
      property="og:image:alt"
      content="The QSimCity mark: a triangular prism over a city grid"
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="QSimCity — the explorable quantum city" />
    <meta
      name="twitter:description"
      content="An unofficial, independent, open-source educational and research visualization of quantum compilation and execution."
    />
    <meta name="twitter:image" content="https://qsimcity.vercel.app/icons/icon-512.png" />
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <p style="padding: 2rem; font-family: system-ui">
        QSimCity is a client-side application and needs JavaScript to run. Nothing is uploaded
        anywhere — all computation happens in your browser.
      </p>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
