[project]
name = "qsimcity-qiskit"
version = "1.0.0"
description = "QSimCity Qiskit bridge: captures real transpiler stages and Aer results as QSimCity Traces"
requires-python = ">=3.12,<3.13"
dependencies = [
    "qiskit==2.5.1",
    "qiskit-aer==0.17.2",
]

[project.scripts]
qsimcity-generate = "qsimcity_qiskit.generate:main"

[dependency-groups]
dev = [
    "pytest==9.0.3",
    "hypothesis==6.140.3",
    "ruff==0.14.5",
    "pyright==1.1.407",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/qsimcity_qiskit"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.pyright]
include = ["src", "tests"]
typeCheckingMode = "standard"
reportMissingTypeStubs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
