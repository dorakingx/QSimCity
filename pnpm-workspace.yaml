packages:
  - apps/*
  - packages/*
allowBuilds:
  esbuild: true

# Security override: brace-expansion <=5.0.7 carries a high-severity ReDoS
# advisory (GHSA-mh99-v99m-4gvg). It reaches the tree only through build-time
# tooling (vite-plugin-pwa -> workbox-build), never the shipped bundle, but is
# forced to the patched release so `pnpm audit` is clean for the whole tree.
overrides:
  brace-expansion: 5.0.8

# intl-messageformat (via lighthouse) requires tslib at runtime but does not
# declare it, which strict pnpm linking correctly refuses to resolve.
publicHoistPattern:
  - tslib
