name: CI

on:
  push:
    branches: [main, 'feat/**']
  pull_request:

jobs:
  verify:
    name: Verify (lint, typecheck, policy scans, tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify
      - run: pnpm test:coverage

  build:
    name: Production build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: apps/web/dist
          retention-days: 7

  e2e:
    name: End-to-end (browser matrix)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium firefox webkit
      - run: pnpm build
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
      # The report alone shows *that* a test failed. The traces, the actual
      # screenshots, and the diff images show *why* — without them a red
      # visual test can only be guessed at from a distance.
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-test-results
          path: test-results
          retention-days: 7

  python:
    name: Qiskit bridge (pytest, pyright, ruff)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python/qsimcity_qiskit
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          # Defence in depth, not the fix. semanticHash must not move because
          # an interpreter reports a different patch version — that is
          # enforced by the hashing contract and its parity tests. Pinning
          # the toolchain as well keeps artifactHash and the lockfile
          # reproducible, and stops an unrelated interpreter change from
          # muddying a future investigation.
          python-version: '3.12.12'
      - run: uv python pin 3.12.12
      - run: uv sync --frozen
      - run: uv run python -c "import platform; print('python', platform.python_version())"
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pyright
      - run: uv run pytest -q

  goal:
    name: Definition-of-Done gate (pnpm goal:check)
    runs-on: ubuntu-latest
    # Depends on the jobs whose results it reports on. A gate that can go
    # green while the public checks beside it are red is worse than no gate:
    # that is exactly how this branch reached a local "33 of 33 passed"
    # while Qiskit and the E2E matrix were failing on Ubuntu. If Python or
    # the browser matrix fails, this job does not run, and the required
    # check never turns green.
    needs: [verify, e2e, python, build]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium firefox webkit
      - run: pnpm goal:check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: goal-check
          path: release-evidence/goal-check.txt
          retention-days: 7
